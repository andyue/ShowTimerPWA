name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  updater-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test updater extraction and failure recovery
        run: node --test tests/updater.test.mjs
      - name: Install bridge dependencies
        run: npm ci
      - name: Test OSC bridge on each platform
        run: node --test --test-name-pattern=OSC tests/network.test.mjs
      - name: Check Mac launcher syntax
        if: runner.os == 'macOS'
        run: |
          zsh -n public/downloads/Update-ShowTimer-Mac.command
          zsh -n public/downloads/Update-OSC-Mac.command
          zsh -n Start-OSC-Mac.command

  build:
    needs: updater-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and network tests
        run: npm test

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Build
        run: npm run build:pages
        env:
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
